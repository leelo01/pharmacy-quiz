<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Which Pharmacy Field Are You?</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container" id="app">
        <div id="introScreen" class="screen active">
            <h1>🧪 Which Pharmacy Field Are You?</h1>
            <p>if you were a pharmacy subject, what subject would you be? Learn about your future subjects by relating to yourself in terms of your own personal traits!!</p>
            <img src="pharmacy.jpeg" alt="Pharmacy" class="main-image" />
            <button id="startBtn">Start Quiz →</button>
        </div>

        <div id="quizScreen" class="screen">
            <div class="progress-container">
                <div class="progress-bar"><span id="progressBar"></span></div>
                <span id="progressText">0 / 10</span>
            </div>
            <div id="questionContainer">
                <h2 id="questionText">Loading...</h2>
                <div id="answersContainer"></div>
            </div>
        </div>

        <div id="resultScreen" class="screen">
            <h2>🎉 Your Results</h2>
            <div id="resultWinner" class="winner"></div>
            <div id="resultChart" class="chart"></div>
            <button id="restartBtn">Take Quiz Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
